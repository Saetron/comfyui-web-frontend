services:
  comfy-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/saetron/comfyui-web-frontend:latest
    container_name: comfyui-web-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - DEFAULT_NEGATIVE_PROMPT=${DEFAULT_NEGATIVE_PROMPT:-worst quality, low quality, bad anatomy, bad hands, missing fingers, extra digits, signature, watermark, blurry, deformed}
      - OUTPUT_DIR=/app/output
      - DATA_DIR=/app/data
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - ./output:/app/output:rw
      - ./appdata:/app/data
    extra_hosts:
      # Allows reaching the host machine (where ComfyUI is running) across Linux, macOS, and Windows Docker
      - "host.docker.internal:host-gateway"
